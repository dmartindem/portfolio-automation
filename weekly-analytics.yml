name: Weekly analytics

# Produces data/analytics.json — the Tier 2 metrics the weekly review reads.
# Runs Sunday 20:00 UTC, three hours before the Claude weekly review at 23:00 UTC,
# so the file is fresh when the review picks it up.

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compute risk, factor and stress analytics
        run: python scripts/analytics.py

      - name: Commit if anything changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "analytics $(date -u +%Y-%m-%d)"
            git push
          fi
