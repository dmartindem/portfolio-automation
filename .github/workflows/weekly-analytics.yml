name: Weekly analytics

# Produces data/analytics.json — the Tier 2 metrics the weekly review reads.
# Runs Tue-Sat 09:47 UTC (04:47 CDT / 03:47 CST), picking up the Mon-Fri closes once they
# are final and 30 min after the morning daily snapshot, and Sunday 20:00 UTC, three hours
# before the Claude weekly review at 23:00 UTC. (Was weekdays 23:00 UTC until 2026-09-16:
# GitHub starts evening runs late, past 00:00 UTC, when Yahoo can omit the latest session.)
# File name kept for history.

on:
  schedule:
    - cron: '0 20 * * 0'       # Sunday, ahead of the 23:00 UTC weekly review
    - cron: '47 9 * * 2-6'     # Tue-Sat morning, Mon-Fri closes: 04:47 CDT / 03:47 CST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test Sharpe decomposition (synthetic data)
        run: python tests/test_sharpe_decomposition.py

      - name: Compute risk, factor and stress analytics
        run: python scripts/analytics.py

      - name: Commit if anything changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "analytics $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 20
          done
          echo "push failed after 3 attempts"; exit 1
