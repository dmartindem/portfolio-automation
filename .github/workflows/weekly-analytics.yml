name: Weekly analytics

# Produces data/analytics.json — the Tier 2 metrics the weekly review reads.
# Runs weekdays 23:00 UTC (after the US close, 30 min clear of the 22:30 daily snapshot)
# and Sunday 20:00 UTC, three hours before the Claude weekly review at 23:00 UTC,
# so the file is fresh when the review picks it up. File name kept for history.

on:
  schedule:
    - cron: '0 20 * * 0'       # Sunday, ahead of the 23:00 UTC weekly review
    - cron: '0 23 * * 1-5'     # weekdays after the US close: 18:00 CDT / 17:00 CST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test Sharpe decomposition (synthetic data)
        run: python tests/test_sharpe_decomposition.py

      - name: Compute risk, factor and stress analytics
        run: python scripts/analytics.py

      - name: Commit if anything changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "analytics $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 20
          done
          echo "push failed after 3 attempts"; exit 1
