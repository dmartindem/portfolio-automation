name: Daily portfolio snapshot

on:
  schedule:
    # 09:17 UTC every day (04:17 CDT / 03:17 CST): the run the page relies on. Yesterday's
    # closes are final by then and it finishes before the 06:30 CT brief and the US open,
    # even when GitHub starts it late. Off the top of the hour to dodge the busiest queue.
    - cron: '17 9 * * *'
    # 22:30 UTC on weekdays = after the US close. GitHub often starts this one after
    # 00:00 UTC, when Yahoo can omit the session that just closed; the scripts refuse to
    # publish an older bar than the one already committed, so a late run can't regress.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # required so the job can commit the updated CSVs

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch closing prices
        run: python scripts/fetch_prices.py

      - name: Recompute look-through concentration
        run: python scripts/concentration.py

      - name: Reference markets (previous close)
        run: python scripts/fetch_markets.py
        continue-on-error: true

      - name: Commit if anything changed
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No change (market closed or no new bar) — nothing to commit."
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep 20
          done
          echo "push failed after 3 attempts"; exit 1
